# MEA3 light-source spectra.
# One [[spectrum]] per measured spectrum. Raw traces live in spectra/raw/<id>/,
# the fitted power-meter file in spectra/powermeter/<id>.csv, the plot in plots/<id>.png.
#
# position:
#   fiber   – measured at the output of the optic fibre
#   mea     – measured after the MEA (the MEA filters out part of the UV)
#   unknown – measurement position still to be documented
#   room    – other lights of the room, not part of the stimulation path

setup = "MEA3"

# --- 2025-12-02 calibration, at the fibre output -----------------------------

[[spectrum]]
id = "2025-12-02_385nm_fiber"
source = "Violet LED 385 nm"
position = "fiber"
color = "darkviolet"

[[spectrum]]
id = "2025-12-02_415nm_fiber"
source = "Blue LED 415 nm"
position = "fiber"
color = "royalblue"

[[spectrum]]
id = "2025-12-02_490nm_fiber"
