# MEA3 light sources and their measured spectra.
#
# [[source]]    one per light source: name, LED model and serial number (Thorlabs).
#               Before the optic fibre, the LEDs go through a series of filters
#               (to be documented).
# [[spectrum]]  one per measured spectrum. Raw traces in spectra/raw/<id>/, fitted
#               power-meter file in spectra/powermeter/<id>.csv, plot in plots/<id>.png.
#   position:
#     fiber – measured at the output of the optic fibre
#     mea   – measured after the MEA (the MEA filters out part of the UV)
#     room  – other lights of the room, not part of the stimulation path

setup = "MEA3"

# --- Light sources -----------------------------------------------------------

