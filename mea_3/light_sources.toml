# MEA3 light sources and their measured spectra.
#
# [[source]]    one per light source: name, LED model and serial number (Thorlabs).
#               LEDs are named after the peak wavelength given by their model name.
#               Before the optic fibre, the LEDs go through a series of filters
#               (to be documented).
# [[spectrum]]  one per measured spectrum, with the date of the measurement. Raw traces in
#               raw_data/<id>/, fitted power-meter file in spectra/<id>.csv, plot in
#               plots/<id>.png.
#   position:
#     fiber – measured at the output of the optic fibre
#     mea   – measured after the MEA (the MEA filters out part of the UV)
#     room  – other lights of the room, not part of the stimulation path
#   line_source = true: narrow emission lines (fluorescent lamp); fitted without the
#     2.5 nm running average and without capping the weights, so the lines are kept.

setup = "MEA3"

# --- Light sources -----------------------------------------------------------

