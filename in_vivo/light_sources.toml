# In vivo setup lights (measured by Jocelyn).
#
# [[source]]    one per lamp setting.
# [[spectrum]]  one per measured spectrum, with the date of the measurement. Raw traces in
#               raw_data/<id>/, fitted power-meter file in spectra/<id>.csv, plot in
#               plots/<id>.png. <id> ends with the lamp intensity setting (pct = %); a
#               trailing _2 marks a second measurement at the same setting.
#   position:
#     lamp – lamp lighting the in vivo setup
#
# raw_data/*_0pct/ hold the traces at 0 % intensity: no light above the noise, kept as dark
# references and not fitted.

setup = "In vivo"

# --- Light sources -----------------------------------------------------------

[[source]]
name = "Lamp1 red"
color = "red"

[[source]]
name = "Lamp2 red"
color = "firebrick"

[[source]]
name = "Lamp2 white 30"
color = "goldenrod"

[[source]]
name = "Lamp2 white 400"
color = "gray"

