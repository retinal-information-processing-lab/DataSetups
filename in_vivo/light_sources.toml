# In vivo setup lights (measured by Jocelyn).
#
# [[source]]    one per lamp setting.
# [[spectrum]]  one per lamp, measured at maximum intensity (least noisy), with the date of
#               the measurement. Raw traces in raw_data/<id>/, fitted power-meter file in
#               spectra/<id>.csv, plot in plots/<id>.png.
#   position:
#     lamp – lamp lighting the in vivo setup

setup = "In vivo"

# --- Light sources -----------------------------------------------------------

[[source]]
name = "Lamp1 red"
color = "red"

[[source]]
name = "Lamp2 red"
color = "firebrick"

[[source]]
name = "Lamp2 white 30"
color = "goldenrod"

[[source]]
name = "Lamp2 white 400"
color = "gray"

# --- Spectra -----------------------------------------------------------------

[[spectrum]]
id = "lamp1_red"
date = 2026-03-31
source = "Lamp1 red"
position = "lamp"

[[spectrum]]
id = "lamp2_red"
date = 2026-03-31
source = "Lamp2 red"
position = "lamp"

[[spectrum]]
id = "lamp2_white30"
date = 2026-03-31
source = "Lamp2 white 30"
position = "lamp"

[[spectrum]]
id = "lamp2_white400"
date = 2026-03-31
source = "Lamp2 white 400"
position = "lamp"
