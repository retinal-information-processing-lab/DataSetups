# MEA2 light sources and their measured spectra (measured by Awen).
#
# [[source]]    one per light source: name, LED model and serial number (Thorlabs).
#               LEDs are named after the peak wavelength given by their model name.
# [[spectrum]]  one per measured spectrum, with the date of the measurement (unknown when
#               not given). Raw traces in raw_data/<id>/, fitted power-meter file in
#               spectra/<id>.csv, plot in plots/<id>.png.
#   position:
#     fiber – measured at the output of the optic fibre
#     mea   – measured after the MEA (the MEA filters out part of the UV)
#     room  – other lights of the room, not part of the stimulation path
#
# LED models and serial numbers still to be added; the names give the nominal wavelength.

setup = "MEA2"

# --- Light sources -----------------------------------------------------------

[[source]]
name = "385nm"
color = "darkviolet"

[[source]]
name = "415nm"
color = "royalblue"

[[source]]
name = "490nm"
color = "green"

[[source]]
name = "530nm"
color = "goldenrod"

[[source]]
name = "625nm"
color = "red"

[[source]]
name = "WarmWhite"
color = "peru"

[[source]]
name = "Binocular red light"
color = "saddlebrown"

[[source]]
name = "Dissection lamp"
color = "firebrick"

[[source]]
name = "Head lamp"
color = "red"

# --- Spectra -----------------------------------------------------------------

[[spectrum]]
id = "385nm_fiber"
source = "385nm"
position = "fiber"

[[spectrum]]
id = "415nm_fiber"
source = "415nm"
position = "fiber"

[[spectrum]]
id = "490nm_fiber"
source = "490nm"
position = "fiber"

[[spectrum]]
id = "530nm_fiber"
source = "530nm"
position = "fiber"

[[spectrum]]
id = "625nm_fiber"
source = "625nm"
position = "fiber"

[[spectrum]]
id = "warmwhite_fiber"
source = "WarmWhite"
position = "fiber"

[[spectrum]]
id = "385nm_mea"
source = "385nm"
position = "mea"

[[spectrum]]
id = "530nm_mea"
source = "530nm"
position = "mea"

[[spectrum]]
id = "room_binocular"
source = "Binocular red light"
position = "room"

[[spectrum]]
id = "room_dissection_lamp"
source = "Dissection lamp"
position = "room"

[[spectrum]]
id = "room_head_lamp"
source = "Head lamp"
position = "room"
